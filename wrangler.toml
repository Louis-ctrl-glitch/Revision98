name = "revision98"
main = "src/worker.js"
compatibility_date = "2026-10-12"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "revision-quest-db"
# Replace this after running: npx wrangler d1 create revision-quest-db
database_id = "ce2b0573-4ef8-450c-b453-d9bd2b25a183"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]


[observability]
enabled = true
